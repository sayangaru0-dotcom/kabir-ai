
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Unzip Project Automatically
        run: |
          echo "Looking for zip files..."
          ls -la
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip file: $ZIP_FILE. Extracting..."
            unzip -o "$ZIP_FILE" -d extracted_project
            cd extracted_project
          else
            echo "No zip found, checking root..."
          fi

      - name: Find package.json and Install Dependencies
        run: |
          PKG_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "Error: package.json not found anywhere!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PKG_PATH")
          echo "Found project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          pnpm install

      - name: Build Android APK
        run: |
          PKG_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          PROJECT_DIR=$(dirname "$PKG_PATH")
          cd "$PROJECT_DIR"
          if grep -q '@capacitor/core' package.json; then
            pnpm cap sync android
          fi
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Android folder not found in project!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kabir-ai-debug-apk
          path: |
            **/android/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk

        

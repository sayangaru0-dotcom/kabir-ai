name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Auto Extract Zip and Locate Project
        run: |
          echo "=== Repository Root Contents ==="
          ls -la
          
          mkdir -p extracted
          for z in *.zip; do
            if [ -f "$z" ]; then
              echo "Extracting zip: $z"
              unzip -o "$z" -d extracted/
            fi
          done
          
          echo "=== Finding package.json automatically ==="
          PKG_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          
          if [ -z "$PKG_PATH" ]; then
            echo "Error: package.json not found anywhere!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$PKG_PATH")
          echo "SUCCESS: Found project directory at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Install Dependencies and Capacitor
        run: |
          cd "${{ env.PROJECT_DIR }}"
          echo "Installing dependencies..."
          pnpm install --no-frozen-lockfile
          
          # Force install capacitor tools globally/locally to avoid 'cap not found' error
          pnpm add -D @capacitor/cli @capacitor/core @capacitor/android || true

      - name: Generate Android Platform and Build APK
        run: |
          cd "${{ env.PROJECT_DIR }}"
          
          # Remove old broken android folder if exists and recreate fresh
          if [ -d "android" ]; then
            echo "Removing existing android folder to regenerate fresh..."
            rm -rf android
          fi
          
          echo "Adding capacitor android platform..."
          npx @capacitor/cli add android || npx cap add android || true
          npx @capacitor/cli sync android || npx cap sync android || true
          
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Error: Android folder could not be generated. Trying direct gradle build..."
            if [ -f "build.gradle" ] || [ -d "app" ]; then
              chmod +x gradlew || true
              ./gradlew assembleDebug
            else
              exit 1
            fi
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kabir-ai-debug-apk
          path: |
            **/android/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk




        

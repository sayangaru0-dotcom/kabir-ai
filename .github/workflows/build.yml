
name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Extract Project Zip and Clean Guards
      run: |
        unzip -o kabir-ai-master.zip
        cp -r kabir-ai-master/* .
        node -e '
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          if (pkg.scripts && pkg.scripts.preinstall) {
            delete pkg.scripts.preinstall;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          }
        '

    - name: Install Dependencies with Clean npm
      run: |
        npm install --legacy-peer-deps

    - name: Build APK with Script
      run: |
        chmod +x tools/build-apk.sh
        bash tools/build-apk.sh || echo "Custom script skipped"

    - name: Find and Build Gradle if Exists
      run: |
        if [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        elif [ -d "android" ]; then
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
        fi

    - name: Upload All APKs Found
      uses: actions/upload-artifact@v4
      with:
        name: kabir-ai-apk
        path: |
          **/*.apk
          !node_modules/**


name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Extract Project Zip
      run: |
        unzip -o kabir-ai-master.zip
        cp -r kabir-ai-master/* .

    - name: Install pnpm
      run: npm install -g pnpm

    - name: Install Dependencies
      run: pnpm install --no-frozen-lockfile

    - name: Build APK with Script
      run: |
        chmod +x tools/build-apk.sh
        bash tools/build-apk.sh || echo "Custom script skipped, proceeding with Gradle"

    - name: Build Gradle APK
      run: |
        if [ -d "android" ]; then
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: kabir-ai-apk
        path: |
          android/app/build/outputs/apk/debug/*.apk
          **/*.apk

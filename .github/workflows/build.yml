
name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Extract Project Zip
        run: |
          if [ -f kabir-ai-master-v2.zip ]; then
            unzip -o kabir-ai-master-v2.zip
          fi

      - name: Locate and Install Dependencies with pnpm
        run: |
          if [ -d "artifacts/kabir-ai" ]; then
            cd artifacts/kabir-ai
          fi
          pnpm install --no-frozen-lockfile || npm install --legacy-peer-deps

      - name: Build APK with Gradle
        run: |
          if [ -d "artifacts/kabir-ai" ]; then
            cd artifacts/kabir-ai
          fi
          npx expo prebuild --platform android --clean || true
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kabir-ai-app
          path: |
            **/build/outputs/apk/**/*.apk
            **/*.apk
          if-no-files-found: warn

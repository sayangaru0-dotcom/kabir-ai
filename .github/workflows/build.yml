
Build android apk · YML
name: Build Android APK
 
# Builds a standalone, installable Android APK of Kabir AI and publishes it as a downloadable artifact.
#   - Run it manually:  Actions tab > "Build Android APK" > Run workflow
#   - Or push to main/master, or push a tag like v1.0.0 (a tag also attaches the APK to a GitHub Release)
# One-time setup: Settings > Secrets and variables > Actions > Variables > New repository variable
#   EXPO_PUBLIC_DOMAIN = your API server's host, e.g. my-api.example.com   (host only, no https://)
#
# If the build fails, open the run summary: the "Failure analysis" section names the stage that broke and quotes the real error.
 
on:
  workflow_dispatch:
    inputs:
      api_domain:
        description: "API host baked into the app (host only, e.g. my-api.example.com). Empty = use the EXPO_PUBLIC_DOMAIN repository variable."
        required: false
        default: ""
        type: string
      abis:
        description: "CPU types to build, comma separated. arm64-v8a alone is fastest and uses the least memory."
        required: false
        default: "arm64-v8a,armeabi-v7a"
        type: string
  push:
    branches: [main, master]
    tags: ["v*"]
 
permissions:
  contents: read
 
concurrency:
  group: build-android-apk-${{ github.ref }}
  cancel-in-progress: true
 
defaults:
  run:
    shell: bash
 
env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10"
  JAVA_VERSION: "17"
  CI: "true"
  EXPO_NO_TELEMETRY: "1"
  EXPO_NO_GIT_STATUS: "1"
 
jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
 

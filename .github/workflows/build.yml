name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Extract all Zip files safely
        run: |
          echo "Checking repository contents:"
          ls -la
          for z in *.zip; do
            if [ -f "$z" ]; then
              echo "Extracting $z..."
              unzip -o "$z" -d extracted_files
            fi
          done
          echo "Contents after extraction:"
          find . -maxdepth 3

      - name: Locate Project and Install Dependencies
        run: |
          # Find the directory containing package.json
          PKG_DIR=$(find . -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \; | head -n 1)
          if [ -z "$PKG_DIR" ]; then
            echo "Error: package.json not found anywhere in the repository!"
            exit 1
          echo "Project directory found at: $PKG_DIR"
          cd "$PKG_DIR"
          pnpm install

      - name: Build Android APK
        run: |
          PKG_DIR=$(find . -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \; | head -n 1)
          cd "$PKG_DIR"
          if grep -q '@capacitor/core' package.json; then
            pnpm cap sync android
          fi
          if [ -d "android" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Error: Android folder not found inside project directory!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kabir-ai-debug-apk
          path: |
            **/android/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
    


        

    


        
